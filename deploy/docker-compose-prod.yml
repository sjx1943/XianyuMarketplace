version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: secondhand-postgres
    environment:
      POSTGRES_DB: ${PGDATABASE:-secondhand_db}
      POSTGRES_USER: ${PGUSER:-secondhand_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-change_me}
      PGTZ: 'Asia/Shanghai'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-secondhand_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MongoDB 数据库
  mongo:
    image: mongo:7-alpine
    container_name: secondhand-mongo
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-chat_db}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me}
      TZ: 'Asia/Shanghai'
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Tornado 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - PYTHON_VERSION=3.11
    container_name: secondhand-app
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://${PGUSER:-secondhand_user}:${PGPASSWORD:-change_me}@postgres:5432/${PGDATABASE:-secondhand_db}
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}:${MONGO_INITDB_ROOT_PASSWORD:-change_me}@mongo:27017/${MONGODB_DATABASE:-chat_db}?authSource=admin
      
      # 应用配置
      DEBUG: "False"
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
      
      # 微信配置
      WX_MINIPROGRAM_APP_ID: ${WX_MINIPROGRAM_APP_ID}
      WX_MINIPROGRAM_APP_SECRET: ${WX_MINIPROGRAM_APP_SECRET}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI}
      
      # 阿里云SMS配置
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE}
      
      # SMTP邮件配置
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_SSL: ${SMTP_USE_SSL}
      
      # 时区
      TZ: Asia/Shanghai
    
    ports:
      - "8000:8000"
    
    volumes:
      # 注意：不要使用 ./:/app 整体挂载，这会导致图片丢失
      # 而是只挂载需要持久化的目录
      - app_uploads:/app/mystatics/images  # 用户上传的图片（持久化存储）
      - app_logs:/app/logs                  # 应用日志
    
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    networks:
      - app-network
    
    command: >
      sh -c "
        echo '等待数据库就绪...' &&
        python3 -c 'import time; time.sleep(10)' &&
        echo '启动Tornado应用...' &&
        python app.py --port=8000
      "
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # Redis (可选缓存)
  redis:
    image: redis:7-alpine
    container_name: secondhand-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
    command: redis-server --appendonly yes
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: secondhand-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_uploads:/app/mystatics/images:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local

networks:
  app-network:
    driver: bridge
