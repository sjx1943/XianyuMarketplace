# ==========================================
# 翠友雅集S - Nginx HTTPS 反向代理配置
# ==========================================
# 文件位置: /etc/nginx/conf.d/secondhand_8543.conf
# 端口: 8543 (HTTPS)
# 后端: 127.0.0.1:8100 (Tornado应用)
# 域名: happepls.pics
# ==========================================

server {
    listen 8543 ssl http2;
    server_name happepls.pics;

    # SSL证书配置 (使用Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/happepls.pics/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/happepls.pics/privkey.pem;

    # 现代TLS配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 客户端最大上传大小 (商品图片)
    client_max_body_size 20M;

    # 日志
    access_log /var/log/nginx/secondhand_access.log;
    error_log /var/log/nginx/secondhand_error.log;

    # 健康检查端点
    location /health {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 静态文件 (商品图片)
    location /static/images/ {
        alias /var/lib/docker/volumes/secondhand_app_uploads/_data/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # 防盗链 (可选)
        # valid_referers none blocked happepls.pics *.happepls.pics;
        # if ($invalid_referer) {
        #     return 403;
        # }
    }

    # WebSocket支持 (聊天功能)
    location /ws/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API请求
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API超时配置
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        
        # 禁用缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 默认反代 (Web页面)
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

