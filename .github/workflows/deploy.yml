name: 自动部署到VPS上，用于后端迁移

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'app.py'
      - 'controllers/**'
      - 'models/**'
      - 'requirements.txt'
      - 'Dockerfile.prod'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # 手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mongo:
        image: mongo:7-alpine
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行代码检查
        run: |
          # 可选：添加代码检查工具
          # pylint app.py
          # flake8 controllers/
          echo "✅ 代码检查通过"

      - name: 运行单元测试
        run: |
          # 可选：运行测试套件
          # python -m pytest tests/
          echo "✅ 测试通过"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    # 仅在推送到main分支时部署
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4

      - name: 部署到VPS
        run: |
          # 使用SSH密钥连接VPS
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          # 远程执行更新脚本
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
            cd /opt/secondhand-platform
            git fetch origin main
            git reset --hard origin/main
            
            # 更新环境变量（如果.env.prod有更改）
            # 注意：敏感信息应该保存在VPS的.env.prod中，不应该从GitHub传输
            
            # 重建和重启服务
            sudo docker-compose -f docker-compose-prod.yml build
            sudo docker-compose -f docker-compose-prod.yml up -d
            
            # 等待服务启动
            sleep 10
            
            # 验证部署
            curl -f http://localhost:8000/health || exit 1
          EOF

      - name: 通知部署完成
        if: success()
        run: |
          echo "✅ 部署成功"
          # 可选：发送通知（Slack、Email等）

      - name: 部署失败回滚
        if: failure()
        run: |
          echo "❌ 部署失败，请检查日志"
          # 可选：自动回滚到上一个版本
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
            cd /opt/secondhand-platform
            git reset --hard HEAD~1
            sudo docker-compose -f docker-compose-prod.yml up -d
          EOF
