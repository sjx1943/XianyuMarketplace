<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信扫码登录</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            text-align: center;
            max-width: 450px;
        }
        h1 {
            margin: 0 0 10px;
            color: #333;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .qr-frame {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            background: #f9f9f9;
        }
        iframe {
            border: none;
            width: 300px;
            height: 300px;
        }
        .instructions {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
        .instructions ol {
            text-align: left;
            padding-left: 20px;
        }
        .back-link {
            margin-top: 20px;
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🏡 小区二手交易平台</h1>
        <p class="subtitle">使用微信扫码登录</p>
        
        <div class="qr-frame">
            <iframe src="{{ qr_url }}"></iframe>
        </div>
        
        <div class="instructions">
            <p><strong>扫码步骤：</strong></p>
            <ol>
                <li>打开微信APP</li>
                <li>点击右上角"+"号</li>
                <li>选择"扫一扫"</li>
                <li>扫描上方二维码</li>
                <li>在微信中确认授权</li>
            </ol>
        </div>
        
        <a href="/login" class="back-link">← 返回登录页面</a>
    </div>
</body>
</html>
