<div class="reset-mode-toggle">
    <button type="button" class="mode-btn active" data-mode="phone">手机号重置</button>
    <button type="button" class="mode-btn" data-mode="email">邮箱重置</button>
</div>

<!-- 手机号重置表单 -->
<form method="post" action="/forgot" class="reset-form phone-reset-form active">
    {% module xsrf_form_html() %}
    <input type="hidden" name="reset_type" value="phone">
    <input type="tel" name="phone" placeholder="手机号" pattern="^1[3-9]\d{9}$" required>
    <div class="verification-group">
        <input type="text" name="code" placeholder="验证码" maxlength="6" required>
        <button type="button" class="send-code-btn" id="send-code-btn-reset">获取验证码</button>
    </div>
    <input type="password" name="new_password" placeholder="新密码（至少6位）" minlength="6" required>
    <input type="password" name="confirm_password" placeholder="确认新密码" minlength="6" required>
    <button type="submit" class="submit-btn">重置密码</button>
</form>

<!-- 邮箱重置表单 -->
<form method="post" action="/forgot" class="reset-form email-reset-form">
    {% module xsrf_form_html() %}
    <input type="hidden" name="reset_type" value="email">
    <input type="email" name="email" placeholder="邮箱" required>
    <button type="submit" class="submit-btn">发送重置链接</button>
</form>

<style>
.reset-mode-toggle {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.mode-btn {
    flex: 1;
    padding: 12px;
    background: #f5f5f5;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    color: #666;
    transition: all 0.3s ease;
}

.mode-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-color: #667eea;
}

.reset-form {
    display: none;
}

.reset-form.active {
    display: block;
}

.reset-form input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
    transition: all 0.3s ease;
}

.reset-form input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.verification-group {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
}

.verification-group input {
    flex: 1;
    margin-bottom: 0;
}

.send-code-btn {
    padding: 14px 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
    transition: all 0.3s ease;
}

.send-code-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
}

.send-code-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
}

/* 移动端适配 */
@media (max-width: 768px) {
    .reset-mode-toggle {
        flex-direction: column;
    }
    
    .verification-group {
        flex-direction: column;
    }
    
    .verification-group input {
        margin-bottom: 12px;
    }
    
    .send-code-btn {
        width: 100%;
    }
}
</style>

<script>
// 模式切换
document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const mode = this.getAttribute('data-mode');
        
        // 切换按钮样式
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        
        // 切换表单显示
        document.querySelectorAll('.reset-form').forEach(f => f.classList.remove('active'));
        document.querySelector(`.${mode}-reset-form`).classList.add('active');
    });
});

// 发送验证码
document.getElementById('send-code-btn-reset').addEventListener('click', function() {
    const btn = this;
    const phoneInput = document.querySelector('.phone-reset-form input[name="phone"]');
    const phone = phoneInput.value.trim();
    
    if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
        alert('请输入有效的手机号');
        return;
    }
    
    // 禁用按钮
    btn.disabled = true;
    let countdown = 60;
    btn.textContent = `${countdown}秒后重试`;
    
    const timer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
            btn.textContent = `${countdown}秒后重试`;
        } else {
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = '获取验证码';
        }
    }, 1000);
    
    // 获取XSRF token
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }
    
    // 发送请求
    fetch('/api/send_verification_code', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-XSRFToken': getCookie('_xsrf')
        },
        body: JSON.stringify({ phone: phone })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            alert('验证码已发送到您的手机');
        } else {
            alert(data.message || '发送失败，请稍后重试');
        }
    })
    .catch(() => {
        alert('网络错误，请稍后重试');
    });
});

// 表单提交前验证
document.querySelector('.phone-reset-form').addEventListener('submit', function(e) {
    const password = this.querySelector('input[name="new_password"]').value;
    const confirm = this.querySelector('input[name="confirm_password"]').value;
    
    if (password !== confirm) {
        e.preventDefault();
        alert('两次输入的密码不一致');
        return false;
    }
});
</script>
