<div class="login-container">
    <div class="login-form">
        <h2>用户登录</h2>
        
        <div class="login-type-switch">
            <button type="button" class="switch-btn active" data-type="password">密码登录</button>
            <button type="button" class="switch-btn" data-type="code">验证码登录</button>
        </div>
        
        <form method="post" action="/login" id="loginForm">
            {% module xsrf_form_html() %}
            <input type="hidden" name="login_type" id="login_type" value="password">
            
            {% if result %}
            <div class="{% if '成功' in result or '登出' in result %}inline-success-message{% else %}inline-error-message{% end %}">
                <span class="message-icon">{% if '成功' in result or '登出' in result %}✓{% else %}⚠{% end %}</span>
                <span class="message-text">{{ result }}</span>
            </div>
            {% end %}
            
            <div id="passwordLoginFields">
                <div class="form-group">
                    <label for="username">用户名/房间号/手机号</label>
                    <input type="text" id="username" name="username" placeholder="支持用户名、房间号（如3-1-801）或手机号">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码">
                </div>
            </div>
            
            <div id="codeLoginFields" style="display: none;">
                <div class="form-group">
                    <label for="phone">手机号</label>
                    <input type="tel" id="phone" name="phone" placeholder="请输入11位手机号" maxlength="11">
                </div>
                <div class="form-group code-group">
                    <label for="code">验证码</label>
                    <div class="code-input-wrapper">
                        <input type="text" id="code" name="code" placeholder="请输入验证码" maxlength="6">
                        <button type="button" id="sendCodeBtn" class="btn-send-code">发送验证码</button>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn-login">登录</button>
            </div>
            <div class="links">
                <a href="/register">注册账号</a>
                <a href="/forgot_password">忘记密码</a>
                <a href="/admin/login" class="admin-link">🛡️ 管理员入口</a>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const switchBtns = document.querySelectorAll('.switch-btn');
    const loginTypeInput = document.getElementById('login_type');
    const passwordFields = document.getElementById('passwordLoginFields');
    const codeFields = document.getElementById('codeLoginFields');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    let countdown = 0;
    
    switchBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            switchBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            
            const type = this.dataset.type;
            loginTypeInput.value = type;
            
            if (type === 'password') {
                passwordFields.style.display = 'block';
                codeFields.style.display = 'none';
                document.getElementById('username').required = true;
                document.getElementById('password').required = true;
                document.getElementById('phone').required = false;
                document.getElementById('code').required = false;
            } else {
                passwordFields.style.display = 'none';
                codeFields.style.display = 'block';
                document.getElementById('username').required = false;
                document.getElementById('password').required = false;
                document.getElementById('phone').required = true;
                document.getElementById('code').required = true;
            }
        });
    });
    
    sendCodeBtn.addEventListener('click', async function() {
        if (countdown > 0) return;
        
        const phone = document.getElementById('phone').value.trim();
        if (!/^1[3-9]\d{9}$/.test(phone)) {
            alert('请输入正确的11位手机号');
            return;
        }
        
        // 获取XSRF token
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
        
        try {
            const xsrfToken = getCookie('_xsrf');
            const response = await fetch('/api/send_code', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-XSRFToken': xsrfToken || ''
                },
                body: JSON.stringify({phone})
            });
            const data = await response.json();
            
            if (data.success) {
                alert(`验证码发送成功！${data.dev_mode ? '开发模式：' + data.code : ''}`);
                countdown = 60;
                sendCodeBtn.disabled = true;
                const timer = setInterval(() => {
                    countdown--;
                    sendCodeBtn.textContent = `${countdown}秒后重发`;
                    if (countdown <= 0) {
                        clearInterval(timer);
                        sendCodeBtn.disabled = false;
                        sendCodeBtn.textContent = '发送验证码';
                    }
                }, 1000);
            } else {
                alert(data.message || '发送失败');
            }
        } catch (error) {
            alert('网络错误，请重试');
        }
    });
});
</script>
