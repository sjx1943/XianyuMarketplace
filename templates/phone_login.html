<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机号登录 - 小区二手商品交易平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-code-btn {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .send-code-btn:hover {
            background: #5568d3;
        }

        .send-code-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e1e8ed;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #666;
            font-size: 14px;
            position: relative;
        }

        .other-login {
            text-align: center;
        }

        .other-login a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .other-login a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .dev-note {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #856404;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>📱 手机号登录</h1>
            <p>输入手机号接收验证码</p>
        </div>

        <div class="dev-note">
            💡 开发模式：验证码将显示在浏览器控制台和服务器日志中
        </div>

        <div id="message" class="message"></div>

        <form id="phone-login-form">
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" name="phone" placeholder="请输入11位手机号" maxlength="11" required>
            </div>

            <div class="form-group">
                <label for="code">验证码</label>
                <div class="input-wrapper">
                    <input type="text" id="code" name="code" placeholder="请输入6位验证码" maxlength="6" required>
                    <button type="button" class="send-code-btn" id="send-code-btn">发送验证码</button>
                </div>
            </div>

            <button type="submit" class="login-btn">登录 / 注册</button>
        </form>

        <div class="divider">
            <span>或</span>
        </div>

        <div class="other-login">
            <a href="/login">使用邮箱/用户名登录</a> | 
            <a href="/register">注册新账号</a>
        </div>
    </div>

    <script>
        const phoneInput = document.getElementById('phone');
        const codeInput = document.getElementById('code');
        const sendCodeBtn = document.getElementById('send-code-btn');
        const loginForm = document.getElementById('phone-login-form');
        const messageDiv = document.getElementById('message');

        let countdown = 0;
        let countdownTimer = null;

        function showMessage(msg, type) {
            messageDiv.textContent = msg;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function startCountdown() {
            countdown = 60;
            sendCodeBtn.disabled = true;
            countdownTimer = setInterval(() => {
                countdown--;
                sendCodeBtn.textContent = `${countdown}秒后重发`;
                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.textContent = '发送验证码';
                }
            }, 1000);
        }

        sendCodeBtn.addEventListener('click', async function() {
            const phone = phoneInput.value.trim();

            if (!phone) {
                showMessage('请输入手机号', 'error');
                return;
            }

            if (phone.length !== 11 || !/^\d{11}$/.test(phone)) {
                showMessage('请输入有效的11位手机号', 'error');
                return;
            }

            try {
                const response = await fetch('/api/send_code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage(result.message, 'success');
                    console.log(`验证码（开发模式）: ${result.dev_code}`);
                    alert(`验证码已发送！\n\n开发模式下，验证码为: ${result.dev_code}\n\n请查看浏览器控制台或服务器日志`);
                    startCountdown();
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                console.error('发送验证码失败:', error);
                showMessage('网络错误，请重试', 'error');
            }
        });

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const phone = phoneInput.value.trim();
            const code = codeInput.value.trim();

            if (!phone || !code) {
                showMessage('请输入手机号和验证码', 'error');
                return;
            }

            try {
                const response = await fetch('/phone_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, code })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage(result.message, 'success');
                    setTimeout(() => {
                        window.location.href = result.redirect_url;
                    }, 1000);
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                console.error('登录失败:', error);
                showMessage('网络错误，请重试', 'error');
            }
        });
    </script>
</body>
</html>
