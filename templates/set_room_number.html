<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置房间号 - 小区二手市场</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .info-box h3 {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .info-box ul {
            list-style: none;
            color: #555;
            font-size: 14px;
            line-height: 1.8;
        }

        .info-box ul li::before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 8px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group .hint {
            margin-top: 8px;
            font-size: 13px;
            color: #888;
        }

        .error-message {
            background: #fee;
            border-left: 4px solid #e53e3e;
            color: #c53030;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 设置房间号</h1>
            <p>欢迎来到小区二手市场！请设置您的房间号以继续使用</p>
        </div>

        <div class="info-box">
            <h3>📋 格式说明</h3>
            <ul>
                <li>格式：楼号-单元号-房间号</li>
                <li>示例：3-1-801（代表3幢1单元801室）</li>
                <li>房间号将作为您在平台上的唯一标识</li>
            </ul>
        </div>

        {% if result %}
        <div class="error-message">
            {{ result }}
        </div>
        {% end %}

        <form method="post" action="/set_room_number">
            {% module xsrf_form_html() %}
            <div class="form-group">
                <label for="room_number">房间号 *</label>
                <input 
                    type="text" 
                    id="room_number" 
                    name="room_number" 
                    placeholder="例如：3-1-801" 
                    pattern="\d{1,3}-\d{1,2}-\d{1,4}"
                    required
                    autofocus
                >
                <div class="hint">请按照"楼号-单元号-房间号"格式输入</div>
            </div>

            <button type="submit" class="submit-btn">确认设置</button>
        </form>
    </div>

    <script>
        // 输入格式提示
        const input = document.getElementById('room_number');
        input.addEventListener('input', function(e) {
            // 只允许输入数字和连字符
            this.value = this.value.replace(/[^\d-]/g, '');
        });

        // 表单提交前验证
        document.querySelector('form').addEventListener('submit', function(e) {
            const roomNumber = input.value.trim();
            const pattern = /^\d{1,3}-\d{1,2}-\d{1,4}$/;
            
            if (!pattern.test(roomNumber)) {
                e.preventDefault();
                alert('房间号格式不正确！\n请按照"楼号-单元号-房间号"格式输入\n例如：3-1-801');
            }
        });
    </script>
</body>
</html>
